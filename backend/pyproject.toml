[project]
name = "backend"
version = "0.1.0"
description = "K9-Sentinel: Threat Analysis, Certificate Validation & Collaborative Intel Engine"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "cryptography>=50.0.2",
    "eth-tester>=0.14.0b1",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "langchain-core>=1.7.6",
    "langchain-groq>=1.1.3",
    "pillow>=13.0.0",
    "py-evm>=0.12.1b1",
    "pydantic>=2.14.3",
    "pytest>=9.2.0",
    "python-multipart>=0.0.33",
    "pyzbar>=0.1.9",
    "qrcode>=8.2",
    "tldextract>=5.4.0",
    "uvicorn[standard]>=0.54.0",
    "web3>=8.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
